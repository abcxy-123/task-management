
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý công việc</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .header {
      background: linear-gradient(120deg, #1d4ed8, #2563eb);
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    .header h1 { margin: 0 0 10px; }
    .header p { margin: 0; opacity: 0.9; }

    .container {
      max-width: 850px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px #0000000a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 20px 8px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #2563eb;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .stat span {
      color: #64748b;
      font-size: 13px;
    }

    h2 { margin-top: 0; font-size: 20px; }

    .add-form {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-add {
      background: #2563eb;
      color: white;
    }

    .btn-edit {
      background: #fef3c7;
      color: #92400e;
    }

    .btn-delete {
      background: #fee2e2;
      color: #b91c1c;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filter-btn {
      background: #e2e8f0;
      color: #475569;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .task:last-child { border-bottom: none; }

    .task input[type="checkbox"] {
      width: 19px;
      height: 19px;
      cursor: pointer;
      accent-color: #16a34a;
    }

    .task-title {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .task.completed .task-title {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .empty {
      padding: 24px;
      text-align: center;
      color: #64748b;
    }

    .message {
      min-height: 22px;
      margin-top: 10px;
      font-size: 14px;
    }

    .error { color: #dc2626; }
    .success { color: #16a34a; }

    .footer {
      text-align: center;
      padding: 24px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .add-form { flex-direction: column; }
      .task { flex-wrap: wrap; }
      .actions { margin-left: auto; }
      .card { padding: 18px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>Task Management</h1>
    <p>Quản lý công việc cá nhân hiệu quả</p>
  </header>

  <main class="container">

    <section class="stats">
      <div class="stat">
        <strong id="total">0</strong>
        <span>Tổng công việc</span>
      </div>

      <div class="stat">
        <strong id="completed">0</strong>
        <span>Đã hoàn thành</span>
      </div>

      <div class="stat">
        <strong id="pending">0</strong>
        <span>Chưa hoàn thành</span>
      </div>
    </section>

    <section class="card">
      <h2>Thêm công việc mới</h2>

      <form class="add-form" id="taskForm">
        <input
          id="taskInput"
          type="text"
          maxlength="255"
          placeholder="Nhập tên công việc..."
          required
        >
        <button class="btn-add" type="submit">
          + Thêm công việc
        </button>
      </form>

      <div id="message" class="message" role="status"></div>
    </section>

    <section class="card">
      <h2>Danh sách công việc</h2>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">
          Tất cả
        </button>
        <button class="filter-btn" data-filter="pending">
          Chưa hoàn thành
        </button>
        <button class="filter-btn" data-filter="completed">
          Đã hoàn thành
        </button>
      </div>

      <div id="taskList"></div>
    </section>

  </main>

  <footer class="footer">
    Task Management | Node.js + PostgreSQL + Render
  </footer>

  <script>
    let tasks = [];
    let currentFilter = 'all';

    const taskList = document.getElementById('taskList');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className =
        'message ' + (isError ? 'error' : 'success');
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Có lỗi xảy ra');
      }

      return data;
    }

    async function loadTasks() {
      try {
        tasks = await apiRequest('/api/tasks');
        renderTasks();
      } catch (error) {
        showMessage(error.message, true);
        taskList.textContent = 'Không thể tải công việc.';
      }
    }

    function renderTasks() {
      const completedCount =
        tasks.filter(task => task.completed).length;

      document.getElementById('total').textContent =
        tasks.length;

      document.getElementById('completed').textContent =
        completedCount;

      document.getElementById('pending').textContent =
        tasks.length - completedCount;

      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'completed') {
          return task.completed;
        }
        if (currentFilter === 'pending') {
          return !task.completed;
        }
        return true;
      });

      taskList.replaceChildren();

      if (filteredTasks.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'Chưa có công việc nào.';
        taskList.appendChild(empty);
        return;
      }

      filteredTasks.forEach(task => {
        const row = document.createElement('div');
        row.className =
          'task' + (task.completed ? ' completed' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.setAttribute(
          'aria-label', 'Đánh dấu hoàn thành'
        );
        checkbox.addEventListener('change', () => {
          toggleTask(task.id);
        });

        const title = document.createElement('span');
        title.className = 'task-title';
        title.textContent = task.title;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.textContent = 'Sửa';
        editBtn.onclick = () => editTask(task);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.textContent = 'Xóa';
        deleteBtn.onclick = () => deleteTask(task.id);

        actions.append(editBtn, deleteBtn);
        row.append(checkbox, title, actions);
        taskList.appendChild(row);
      });
    }

    document.getElementById('taskForm')
      .addEventListener('submit', async event => {
        event.preventDefault();

        const input = document.getElementById('taskInput');
        const title = input.value.trim();

        if (!title) return;

        try {
          await apiRequest('/api/tasks', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ title })
          });

          input.value = '';
          showMessage('Đã thêm công việc thành công!');
          await loadTasks();
        } catch (error) {
          showMessage(error.message, true);
        }
      });

    async function toggleTask(id) {
      try {
        await apiRequest(`/api/tasks/${id}/complete`, {
          method: 'PATCH'
        });

        await loadTasks();
      } catch (error) {
        showMessage(error.message, true);
        await loadTasks();
      }
    }

    async function editTask(task) {
      const newTitle = prompt(
        'Chỉnh sửa tên công việc:',
        task.title
      );

      if (newTitle === null) return;

      const title = newTitle.trim();

      if (!title || title.length > 255) {
        showMessage(
          'Tên công việc phải từ 1 đến 255 ký tự.',
          true
        );
        return;
      }

      try {
        await apiRequest(`/api/tasks/${task.id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title })
        });

        showMessage('Đã cập nhật công việc!');
        await loadTasks();
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    async function deleteTask(id) {
      if (!confirm('Bạn có chắc muốn xóa công việc?')) {
        return;
      }

      try {
        await apiRequest(`/api/tasks/${id}`, {
          method: 'DELETE'
        });

        showMessage('Đã xóa công việc!');
        await loadTasks();
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    document.querySelectorAll('.filter-btn')
      .forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn')
            .forEach(btn => btn.classList.remove('active'));

          button.classList.add('active');
          currentFilter = button.dataset.filter;
          renderTasks();
        });
      });

    loadTasks();
  </script>
</body>
</html>
